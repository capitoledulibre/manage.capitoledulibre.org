{{define "content"}}
<article class="login-box">
  <h2>Chevauchement de créneaux</h2>
  <p>Le créneau <b>{{time .Slot.StartsAt}} – {{time .Slot.EndsAt}}</b> chevauche :</p>
  <ul>{{range .Overlaps}}<li>{{.PoleName}}{{if .Title}} – {{.Title}}{{end}} ({{time .StartsAt}} – {{time .EndsAt}})</li>{{end}}</ul>
  <form method="post" action="/slots/{{.Slot.ID}}/signup" class="actions">
    <input type="hidden" name="force" value="1"><input type="hidden" name="back" value="{{.Back}}">
    <button>M'inscrire quand même</button>
    <a href="{{if .Back}}{{.Back}}{{else}}/slots/{{.Slot.ID}}{{end}}" role="button" class="secondary outline">Annuler</a>
  </form>
</article>
{{end}}

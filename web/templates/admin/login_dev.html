{{define "content"}}
<div class="card mx-auto max-w-md">
  <h1 class="card-title">Connexion staff (développement)</h1>
  <p class="mb-4 text-sm text-gray-600">OIDC n'est pas configuré. En mode développement, saisissez un email autorisé.</p>
  <form method="post" action="/admin/login" class="space-y-3">
    <input class="input" type="email" name="email" required placeholder="vous@exemple.org" aria-label="Email">
    <button class="btn w-full">Se connecter</button>
  </form>
</div>
{{end}}

{{define "content"}}
<div class="card mx-auto max-w-md text-center">
  <h1 class="text-xl font-semibold">{{t .Lang "login.confirm_title"}}</h1>
  <p class="mt-3 text-sm text-gray-600">{{t .Lang "login.confirm_body" .D.Email}}</p>
  <form method="post" action="/auth/{{.D.Token}}" class="mt-6">
    <button class="btn w-full">{{t .Lang "login.confirm_submit"}}</button>
  </form>
</div>
{{end}}

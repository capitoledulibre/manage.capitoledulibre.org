{{define "content"}}
<div class="card mx-auto max-w-md">
  <h1 class="card-title">{{t .Lang "choose.title"}}</h1>
  <p class="mb-4 text-sm text-gray-600">{{t .Lang "choose.help"}}</p>
  <ul class="space-y-2">
    {{range .D}}
    <li>
      <form method="post" action="/p/choose">
        <input type="hidden" name="manager" value="{{.ManagerUID}}">
        <button class="btn-secondary w-full justify-start">{{.Org.Name}}</button>
      </form>
    </li>
    {{end}}
  </ul>
</div>
{{end}}
